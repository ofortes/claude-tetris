name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio
            (título: "${{ github.event.issue.title }}").

            1. Lee el cuerpo del issue y, si es necesario, el código relevante en
               game.js, index.html o style.css para entender el problema.
            2. Asigna los labels que correspondan usando SOLO los labels ya
               existentes en el repo (bug, documentation, duplicate, enhancement,
               good first issue, help wanted, invalid, question, wontfix). No
               crees labels nuevos. Usa `gh issue edit ${{ github.event.issue.number }}
               --add-label "<label>"` para cada uno; si un label ya no aplica tras
               una edición, quítalo con `--remove-label`.
            3. Publica un comentario en el issue (`gh issue comment
               ${{ github.event.issue.number }} --body "..."`) con un diagnóstico
               general en español que incluya:
               - Resumen del problema.
               - Causa probable (si aplica) o información que falta para
                 diagnosticar.
               - Área(s)/función(es) del código afectadas (con referencia a
                 archivo y, si es posible, nombre de función).
               - Complejidad estimada de la solución (baja/media/alta) y una
                 breve sugerencia de enfoque, sin implementar el fix.
               Si el issue ya tiene un comentario de diagnóstico previo de Claude
               (por una edición anterior), actualiza/reemplaza tu análisis con uno
               nuevo en un comentario adicional en vez de repetir literalmente el
               mismo texto.
          claude_args: '--allowedTools "Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"'
